name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Format · Lint · Locales · Test · Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lint cannot catch this — eslint-config-prettier disables every formatting rule.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check locales
        run: npm run check-locales

      - name: Unit tests
        run: npm run test

      - name: Build (typecheck + bundle)
        run: npm run build
