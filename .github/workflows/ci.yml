name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Format · Lint · Locales · Test · Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lint cannot catch this — eslint-config-prettier disables every formatting rule.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check locales
        run: npm run check-locales

      - name: Unit tests
        run: npm run test

      # The URL rides the command so this step and `seed gate` are one string. It was a repo variable,
      # which CI could read and a local gate could not — and dev needs API_URL empty for the proxy to
      # match, so no committed env file can supply it either. Inlined into the bundle regardless, and
      # this artifact gates a push and is never deployed — Vercel holds what ships.
      - name: Build (typecheck + bundle)
        run: API_URL=https://api.showcase.mkdigital.sk npm run build

      # CI gates main, Vercel deploys production. A promote that never happens is invisible until the
      # live site turns out to be stale, so count the gap here rather than discover it in the bundle.
      - name: Report unreleased commits
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ahead=$(gh api "repos/${{ github.repository }}/compare/production...main" --jq .ahead_by)
          echo "**${ahead}** commit(s) on \`main\` not yet released to \`production\`" >> "$GITHUB_STEP_SUMMARY"
